name: CaveDive Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'scenes/**'
      - 'assets/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout game source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Godot Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            'platform-tools' \
            'build-tools;35.0.1' \
            'platforms;android-35' \
            'cmake;3.10.2.4988404' \
            'ndk;28.1.13356709'
          test -x "${ANDROID_SDK_ROOT}/platform-tools/adb"

      - name: Install Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7.2'
          use-dotnet: false
          include-templates: true

      - name: Validate scripts and import project resources
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-import.log; then
            echo 'GDScript parse/import error detected.'
            exit 1
          fi

      - name: Configure Godot Android export paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          python3 - <<'PYEDITOR'
          from pathlib import Path
          import os, re
          path = Path.home() / '.config/godot' / 'editor_settings-4.7.tres'
          source = path.read_text() if path.exists() else '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          if '[resource]' not in source:
              raise SystemExit('Invalid Godot editor settings: [resource] missing')
          entries = {
              'export/android/android_sdk_path': os.environ['ANDROID_SDK_ROOT'],
              'export/android/java_sdk_path': os.environ['JAVA_HOME'],
          }
          for key, value in entries.items():
              line = f'{key} = "{value}"'
              expr = rf'^{re.escape(key)}\s*=.*$'
              if re.search(expr, source, flags=re.MULTILINE):
                  source = re.sub(expr, lambda _m, line=line: line, source, flags=re.MULTILINE)
              else:
                  source += '\n' + line + '\n'
          path.write_text(source)
          print(f'Android SDK: {entries["export/android/android_sdk_path"]}')
          print(f'Java SDK: {entries["export/android/java_sdk_path"]}')
          PYEDITOR

      - name: Create temporary test-only debug keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/cavedive-debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            -dname 'CN=CaveDive Debug,O=CaveDive,C=ID' \
            -keyalg RSA -keysize 2048 -validity 3650

      - name: Export Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/cavedive-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug Android build/CaveDive-Android-debug.apk 2>&1 | tee /tmp/godot-export.log
          test -s build/CaveDive-Android-debug.apk
          unzip -t build/CaveDive-Android-debug.apk | tail -n 2
          ls -lh build/CaveDive-Android-debug.apk

      - name: Upload APK to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CaveDive-Android-debug-APK
          path: build/CaveDive-Android-debug.apk
          retention-days: 14
          if-no-files-found: error
